<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard - Monclip</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

<header class="navbar">

  <div class="logo">
    Monclip
  </div>

  <nav>

    <a href="dashboard.html">
      Dashboard
    </a>

    <a href="campaigns.html">
      Campaigns
    </a>

    <a href="brand.html">
      Brand
    </a>

    <a href="admin.html">
      Admin
    </a>

    <button
      class="btn logout-btn"
      type="button"
    >
      Logout
    </button>

  </nav>

</header>


<main class="container">

  <div class="card">

    <h1>
      Admin Dashboard
    </h1>

    <p>
      Review creator submissions and manage verified views.
    </p>

  </div>


  <div class="card">

    <h2>
      Submission Management
    </h2>

    <div id="adminMessage"></div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>
              Creator
            </th>

            <th>
              Campaign
            </th>

            <th>
              Video
            </th>

            <th>
              Views
            </th>

            <th>
              Verified Views
            </th>

            <th>
              Earnings
            </th>

            <th>
              Status
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>


        <tbody id="submissionTable">

        </tbody>

      </table>

    </div>

  </div>

</main>


<script src="js/app.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
